<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nick Mahtani — CV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #fff;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }
    header h1 { font-size: 1.5rem; font-weight: 600; color: #222; }
    header p { margin-top: 0.25rem; color: #666; font-size: 0.95rem; }
    header a {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.5rem 1.25rem;
      background: #222;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    header a:hover { background: #444; }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 1.5rem;
    }
    iframe {
      width: 100%;
      max-width: 900px;
      height: 85vh;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Nick Mahtani</h1>
    <p>Curriculum Vitae</p>
    <a href="cv.pdf" download>Download PDF</a>
  </header>
  <main>
    <iframe src="cv.pdf" title="CV"></iframe>
  </main>
</body>
</html>
